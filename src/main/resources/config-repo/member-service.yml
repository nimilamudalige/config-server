server:
  port: ${SERVER_PORT:8081}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:pulsefit_member_db}?useSSL=${DB_USE_SSL:false}&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

# Google Cloud Storage - member profile photos (Cloud Storage requirement)
gcp:
  project-id: ${GCP_PROJECT_ID:pulsefit-capstone}
  storage:
    bucket-name: ${GCS_BUCKET_NAME:pulsefit-member-photos}

logging:
  file:
    name: /var/log/pulsefit/member-service.log
